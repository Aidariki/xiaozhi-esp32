name: Build ESP32 Firmware (JC1060P470C)

on:
  push:
    branches: [ feature/jc1060p470c ]
  pull_request:
    branches: [ feature/jc1060p470c ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Важно: каждая запись run выполняется в отдельном шелле, поэтому
      # активация ESP-IDF (. export.sh) должна быть в том же шаге, что и сборка.
      - name: Сборка прошивки (Guition JC1060P470C, ESP32-P4)
        run: |
          . /opt/esp/idf/export.sh
          # Тип платы прописывается ДО set-target: при генерации sdkconfig
          # из sdkconfig.defaults выбор платы должен быть задан явно,
          # иначе BOARD_DIR не определится и конфигурация упадёт.
          echo 'CONFIG_IDF_TARGET="esp32p4"' >> sdkconfig.defaults
          echo 'CONFIG_BOARD_TYPE_GUITION_JC1060P470=y' >> sdkconfig.defaults
          # Выбранный в конфигураторе («Интерактивные глаза (JC1060P470C)»)
          # нестандартный облик глаз включается одной строкой ниже.
          # Для стандартного облика удалите её или выберите EYES_TYPE_STANDARD.
          echo 'CONFIG_EYES_TYPE_KAWAII=y' >> sdkconfig.defaults
          idf.py set-target esp32p4
          idf.py build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
