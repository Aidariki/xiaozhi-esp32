name: Build ESP32 Firmware (JC1060P470C)

on:
  push:
    branches: [ feature/jc1060p470c ]
  pull_request:
    branches: [ feature/jc1060p470c ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure board (Guition JC1060P470C, ESP32-P4)
        run: |
          mkdir -p main
          cat >> main/Kconfig.projbuild <<'EOF'

          menu "Custom Board Config"
              config CUSTOM_BOARD_TYPE
                  string
                  default BOARD_TYPE_GUITION_JC1060P470
          endmenu
          EOF

      - name: Build firmware
        run: |
          idf.py set-target esp32p4
          idf.py build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
