name: Build ESP32 Firmware

on:
  push:
    branches: [ feature/jc1060p470c ]
  pull_request:
    branches: [ feature/jc1060p470c ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up ESP-IDF
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip cmake ninja-build ccache libffi-dev libssl-dev
          git clone -b v6.0.2 --recursive https://github.com/espressif/esp-idf.git $HOME/esp-idf
          export IDF_PATH=$HOME/esp-idf
          $HOME/esp-idf/install.sh

      - name: Build firmware
        run: |
          . $HOME/esp-idf/export.sh
          idf.py build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v3
        with:
          name: esp32-firmware
          path: build/*.bin
